[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names.
# %(rev)s  = revision id   (e.g. a1b2c3d4e5f6)
# %(slug)s = short message (e.g. create_users_table)
# %(year)d, %(month).2d, %(day).2d = date parts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path setup — allows `from src.models import Base` in env.py
prepend_sys_path = .

# Timezone for generated migration file timestamps
timezone = UTC

# Max characters in the auto-generated slug
truncate_slug_length = 40

# Locking for concurrent migration runs (PostgreSQL advisory locks)
version_path_separator = os

# sqlalchemy.url is set dynamically in env.py from settings.SYNC_DATABASE_URL
# Do NOT put credentials here — leave this commented out.
# sqlalchemy.url = postgresql+psycopg2://user:pass@host/db

[post_write_hooks]
# Leave empty — no auto-formatting of migration files

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
