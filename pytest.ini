[pytest]
# asyncio_mode = auto means every async def test_*() function
# is automatically treated as an async test.
asyncio_mode = auto

# Show test output even for passing tests (-v = verbose)
addopts = -v --tb=short

# Test discovery
testpaths = tests

# pytest-env: inject env vars before tests run.
# D = override even if the var is already set in the shell.
# These ensure tests never read a real .env file.
[pytest:env]
APP_ENV=development
SECRET_KEY=test-secret-key-do-not-use-in-production-32chars
DATABASE_URL=sqlite+aiosqlite:///:memory:
REDIS_URL=redis://localhost:6379/1
DEBUG=false
